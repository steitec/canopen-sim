name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - run: pytest -v examples/test_example.py

  vcan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Virtual CAN interface and can-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y can-utils
          # vcan is built in or in the base modules on most kernels; only fall
          # back to the extra-modules package when modprobe fails
          sudo modprobe vcan || {
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe vcan
          }
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          ip -details link show vcan0
      - name: Record the bus with candump (a second view of the traffic, not asserted)
        run: nohup candump -L -l vcan0 > /dev/null 2>&1 &
      - name: Success scenario on vcan0
        run: pytest -v -m vcan
      - name: The simulator serves vcan0 and answers the control channel
        run: |
          canopen-sim serve --bench examples/axis.yaml --interface socketcan --channel vcan0 > serve.log 2>&1 &
          serve=$!
          for _ in $(seq 50); do canopen-sim state > /dev/null 2>&1 && break; sleep 0.2; done
          canopen-sim state | grep -q axis
          canopen-sim inject over_temperature --node axis
          canopen-sim state | grep -q 0x4310
          canopen-sim clear --node axis
          kill "$serve"
          wait "$serve" || true
          cat serve.log
      - name: The pytest example on vcan0 (the plugin starts its own bench on the socketcan file)
        run: pytest -v examples/test_example.py --canopen-bench examples/axis-socketcan.yaml
      - name: Stop candump
        if: always()
        run: pkill candump || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candump-vcan0
          path: candump-*.log
          if-no-files-found: warn
